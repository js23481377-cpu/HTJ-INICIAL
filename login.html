<!DOCTYPE html>
<html lang="es">
<head>
    <!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIFE TRADING - Acceso Privado</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      margin: 0;
      background: #0d0f12;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: rgba(18, 20, 26, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    /* FIX ESTILOS DE NAVEGACIÓN Y PESTAÑAS (DARK) */
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }
    .auth-tab {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #a1a1aa;
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      color: #ffffff;
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.2);
    }
    /* FIX ESTILO OSCURO PARA INPUTS (ELIMINA EL BLANCO) */
    .modal-form .form-group input {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #ffffff !important;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      outline: none;
      width: 100%;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }
    .modal-form .form-group input:focus {
      border-color: #22c55e !important;
    }
    .modal-form .form-group label {
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- ENCABEZADO DE MARCA -->
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 48px; height: 48px; background: rgba(34, 197, 94, 0.15); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; color: #22c55e; margin-bottom: 12px; border: 1px solid rgba(34, 197, 94, 0.3);">
          <i data-lucide="shield-check" style="width: 24px; height: 24px;"></i>
        </div>
        <h2 style="font-size: 22px; font-weight: 800; color: #fff; margin: 0;">LIFE TRADING</h2>
        <p style="font-size: 12px; color: #a1a1aa; margin-top: 4px;">Plataforma de Trading Privada & Exclusiva</p>
      </div>

      <!-- PESTAÑAS (ÚNICAMENTE SOLICITAR CÓDIGO E INGRESAR CÓDIGO) -->
      <div class="auth-tabs">
        <button id="tabRequest" class="auth-tab active">Solicitar Acceso</button>
        <button id="tabValidate" class="auth-tab">Ingresar Código</button>
      </div>

      <!-- FORMULARIO 1: SOLICITAR ACCESO -->
      <form id="formRequest" class="modal-form">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="reqEmail" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
          <label>Apodo de Trader (Username)</label>
          <input type="text" id="reqUsername" placeholder="Ej. JUANO" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="reqPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-save-modal" style="width: 100%; margin-top: 14px; justify-content: center; border-radius: 12px; background: #22c55e; color: #000; font-weight: 800;">Solicitar Código</button>
      </form>

      <!-- FORMULARIO 2: VALIDAR CÓDIGO -->
      <form id="formValidate" class="modal-form" style="display: none;">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="valEmail" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
          <label>Código de Acceso Recibido</label>
          <input type="text" id="valCode" placeholder="Ej. LT-8492" style="text-transform: uppercase;" required>
        </div>
        <button type="submit" class="btn-save-modal" style="width: 100%; margin-top: 14px; background: #22c55e; color: #000; font-weight: 800; justify-content: center; border-radius: 12px;">Activar e Ingresar</button>
      </form>

      <div id="authStatusMsg" style="margin-top: 18px; font-size: 12px; text-align: center; font-weight: 600;"></div>

    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
